header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.08em;font-style:italic}
header p{margin:4px 0 0;font-size:12px;color:var(--mut);letter-spacing:.2em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.card img,.big{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--line)}
.card .t{padding:9px 10px 11px}
.card .n{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.card .p{margin-top:5px;font-size:15px;color:var(--acc);font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
.galw{position:relative}.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}.gal img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center;background:var(--line)}.cnt{position:absolute;right:10px;bottom:10px;background:#000a;color:#fff;font-size:12px;padding:3px 10px;border-radius:12px}
.ov{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.bar b{font-size:16px}
button{font:inherit;cursor:pointer}
.lnk{background:none;border:0;color:var(--acc);font-size:15px;padding:6px}
.btn{display:block;text-align:center;text-decoration:none;width:100%;background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:14px;font-size:16px;letter-spacing:.1em}
.btn.sec{background:none;color:var(--acc);border:1px solid var(--acc)}
.body{padding:16px}
.body h2{margin:0 0 6px;font-size:21px;line-height:1.35}
.body .p{font-size:22px;color:var(--acc);font-weight:700;margin-bottom:14px}
.body .d{white-space:pre-wrap;line-height:1.8;font-size:15px;margin-bottom:22px}
.fab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--acc);color:var(--on);border:0;border-radius:24px;padding:11px 18px;font-size:14px;z-index:10;box-shadow:0 2px 10px #0004}
form{display:grid;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
input,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:90px}
.row{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.row img{width:54px;height:54px;object-fit:cover;border-radius:6px}
.stk{font-size:12px;color:var(--mut);margin-top:3px}.stk.out{color:#b3402f}.sinp{width:70px;padding:5px 8px;font-size:14px;margin-top:4px}
.row div{flex:1;min-width:0;font-size:14px}
.row .del{color:#b3402f;background:none;border:1px solid #b3402f;border-radius:8px;padding:6px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:40;max-width:88%;text-align:center}
</style>
</head>
<body>
<header><div class="logo" role="img" aria-label="linline_more"></div><h1>linline_more</h1><p>ANTIQUES · 古董老件收藏</p></header>
<div id="app"></div>
<div id="overlays"></div>
<script>
const THREADS='https://www.threads.com/@linlin_more';
const $=s=>document.querySelector(s);
let data=[];try{data=JSON.parse($('#data').textContent)||[]}catch(e){}

const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML};
const money=v=>'NT$ '+Number(v||0).toLocaleString('en-US');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

function render(){
  $('#app').innerHTML='<div class="grid">'+(data.length?data.map(p=>`<div class="card" data-id="${esc(p.id)}"><img loading="lazy" src="${esc(pics(p)[0].url)}" alt=""><div class="t"><div class="n">${esc(p.name)}</div><div class="p">${money(p.price)}</div>${stk(p)}</div></div>`).join(''):'<div class="empty">商品準備中，敬請期待</div>')+'</div>';
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openItem(c.dataset.id));
}
function closeOv(){$('#overlays').innerHTML=''}
const pics=p=>p.imgs&&p.imgs.length?p.imgs:[{url:p.img,id:p.asset}];
const stk=p=>p.stock==null?'':(p.stock>0?`<div class="stk">庫存 ${p.stock}</div>`:`<div class="stk out">已售出</div>`);
function openItem(id){
  const p=data.find(x=>x.id===id);if(!p)return;
  $('#overlays').innerHTML=`<div class="ov"><div class="bar"><button class="lnk" id="bk">‹ 返回</button><b>商品詳情</b><span style="width:56px"></span></div><div class="galw"><div class="gal">${pics(p).map(i=>`<img src="${esc(i.url)}" alt="">`).join('')}</div>${pics(p).length>1?`<div class="cnt" id="cnt">1/${pics(p).length}</div>`:''}</div><div class="body"><h2>${esc(p.name)}</h2><div class="p">${money(p.price)}</div>${stk(p)}<div class="d">${esc(p.detail)}</div><a class="btn" id="ask" href="${THREADS}" target="_blank" rel="noopener">我想詢問及購買</a></div></div>`;
  $('#bk').onclick=closeOv;
  const g=$('.gal'),cn=$('#cnt');if(cn)g.onscroll=()=>{cn.textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+'/'+pics(p).length};
  $('#ask').onclick=()=>{
    const msg=`您好，我想詢問／購買：${p.name}（${money(p.price)}）`;
    try{navigator.clipboard.writeText(msg)}catch(e){}
  };
}

$('#app').innerHTML='<div class="grid"><div class="empty">載入中…</div></div>';
fetch('products.json?t='+Date.now()).then(r=>r.json()).then(j=>{data=j;render()}).catch(()=>render());
</script>


</body></html>
